<!DOCTYPE html>
<html>

<head>
    <title>Solar System</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .planet {
            border: 1px solid white;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Solar System</h1>

    <div id="solar"></div>

    <script>
        let planets = [
            {
                name: "Mercury",
                info: "Mercury is the closest planet to the Sun. It is the smallest planet of the Solar System."
            },
            {
                name: "Venus",
                info: "Venus is the hottest planet. Venus is the second largest planet of the planet. Venus is also known as the morning and evening star. Earth and Venus are also called twins. "
            },
            {
                name: "Earth",
                info: "Earth is the only known planet with life. Earth is the only planet in the whole universe which has water. It is the 3rd closest planet from the sun. Mars also had water before 4.6 billion years. Mars has two moons."
            },
            {
                name: "Mars",
                info: "Mars is called the Red Planet. Mars is the 4th closest planet from the sun. Mars also had water before 4.6 billion years. Mars has two moons."
            },
            {
                name: "Jupiter",
                info: "Jupiter is the largest planet. Jupiter has nearly"
            },
            {
                name: "Saturn",
                info: "Saturn has beautiful rings."
            },
            {
                name: "Uranus",
                info: "Uranus rotates on its side."
            },
            {
                name: "Neptune",
                info: "Neptune is the farthest planet from the Sun."
            }
        ];

        let solar = document.getElementById("solar");

        for (let i = 0; i < planets.length; i++) {
            let div = document.createElement("div");
            div.className = "planet";

            div.innerHTML =
                "<h2>" + planets[i].name + "</h2>" +
                "<p>" + planets[i].info + "</p>";

            solar.appendChild(div);
        }
    </script>

</body>

</html>
