<!DOCTYPE html>
<html>
    <head>
        <title> Welcome to slideshow </title>
    </head>
    <body>
        <section>
            <img class="mySlides" src="mumbai image.jpg" style="height: 500px;">
            <img class="mySlides" src="kolkata.jpg" style="height: 500px;">
        </section>
        <script>

            var myIndex = 0;
            carousel();

            function carousel () {
                var i;
                var x = document.getElementsByClassName("mySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 100000);
            }
        </script>
    </body>
</html>
