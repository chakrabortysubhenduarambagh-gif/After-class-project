<!DOCTYPE html>
<html>
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My Portfolio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="icon" href="student.png" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
            <section class="py-5" style="background-color: rgb(236, 190, 201);" id="contact">
                <div class="container">
                    <h2 class="fw-bold text-center mb-4">Contact Me</h2>
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <form id="contactForm" action="https://formspree.io/f/mpqgvowe" method="POST">
                                <input class="form-control mb-3" name="name" placeholder="Your name" required>
                                <input class="form-control mb-3" name="email" type="email" placeholder="Your email" required>
                                <textarea class="form-control mb-3" name="message" rows="3" placeholder="Your message"
                                    required></textarea>
                                <button class="btn btn-success w-100 fw-bold" type="submit">Send Message ✉️</button>
                            </form>
                            <div class="alert alert-success mt-3 d-none" id="sentOk">Message sent ✅</div>
                            <div class="alert alert-danger mt-3 d-none" id="sentFail">Oops! Try again ❌</div>
                        </div>
                    </div>
                </div>
            </section>
    </body>
</html>
