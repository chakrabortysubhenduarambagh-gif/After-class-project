<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Jumbotron</title>
        
        
        <meta charset="utf-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        
        
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

        </script>
    </head>
    <body style="text-align: center;">
        <div class="jumbotron jumbotron-fluid">
            <p> This code is written by using jombotron </p>
        </div>
        <div class="normal">
           <p> This text is written in vs code in a normal named div class in a paragraph </p>
        </div>
        <button type="button" class="btn btn-primary"> This written by blue </button>
        <button type="button" class="btn btn-success"> This written by green </button>
        <button type="button" class="btn btn-secondary"> This is written by grey </button>
        <button type="button" class="btn btn-danger"> This is written by red </button>
        <button type="button" class="btn btn-warning"> This is written by yellow </button>
        <button type="button" class="btn btn-info"> This is written by teal </button>
        <div class="progress"> 
            <div class="progress-bar" style="width: 10%;">10%</div>
        </div>
    </body>
</html>
