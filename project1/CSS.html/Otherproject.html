<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="hero">
        <div class="hero-text">
            <h1>Explore the Wild</h1>
            <p>Your journey into the heart of nature begins here.</p>
            <a href="#gallery" class="btn">Start Exploring</a>
        </div>
    </header>

    <section id="gallery" class="gallery">
        <h2>Recent Expeditions</h2>
        <div class="grid">
            <div class="card">
                <img src="https://unsplash.com" alt="Forest Canopy">
                <h3>The Deep Woods</h3>
            </div>
            <div class="card">
                <img src="https://unsplash.com" alt="Mountain Lake">
                <h3>Alpine Waters</h3>
            </div>
            <div class="card">
                <img src="https://unsplash.com" alt="Desert Sunset">
                <h3>Desert Horizons</h3>
            </div>
        </div>
    </section>
</body>

</html>
