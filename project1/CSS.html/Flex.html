<!DOCTYPE html>
<html>
    <head>
        <title> Flex container </title>
    </head>
    <style>
        .flex-container{
            display: flex;
            width: 200px;
            padding: 20px;
            background-color: blue;
        }
        .flex-container p{
            width: 200px;
            background-color: white;
            color: black;
            margin: 5%;
            padding: 5px;
        }

    </style>
    <body>
        <div class="flex-container">
            <p> Suborna Chakraborty </p>
            <p> Class 5 DPS</p>
            
        </div>
    </body>
</html>
