<!DOCTYPE html>
<html>
    <head> 
        <title> Grid-Layout </title>
        <style> 
            .grid-item1 {
                grid-area: header;
            }
            .grid-item2 {
                grid-area: menu; 
            }
            .grid-item3 {
                grid-area: main;
            }
            .grid-item4 {
                grid-area: footer;
            }
            .grid-container {
                display: grid;
                grid-template-columns: auto auto auto auto auto;
                grid-template-areas: 
                'menu header header header header'
                'menu main main main main'
                'menu footer footer footer footer';
                background-color: blue;
                padding: 45px;
            }
            .grid-container div {
                background-color: yellow;
                text-align: center;
                padding: 35px;
                border: 10px solid black;
            }
        </style>
    </head>
    <body> 
        <div class="grid-container">
            <div class="grid-item1"> This is Header </div>
            <div class="grid-item2"> This is Menu </div>
            <div class="grid-item3"> This is Main </div>
            <div class="grid-item4"> This is Footer </div>
        </div>
    </body>
</html>
